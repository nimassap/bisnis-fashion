<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tidak ada koneksi · Bisnis Fashion</title>
    <!--
    | Shown only when a page is asked for and the network cannot answer.
    |
    | Standalone on purpose: it has to work with no stylesheet, no fonts and no
    | connection, so everything it needs is in this one file.
    -->
    <style>
        :root {
            color-scheme: light dark;
            --bg: #eef1f8;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --accent: #2563eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f182b;
                --card: #141d33;
                --text: #e6edf8;
                --muted: #8e96a5;
                --line: #26324c;
                --accent: #60a5fa;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 22rem;
            padding: 2rem 1.75rem;
            border: 1px solid var(--line);
            border-radius: 1.5rem;
            background: var(--card);
            box-shadow: 0 2px 4px rgb(30 41 59 / 0.05), 0 28px 56px -24px rgb(30 41 59 / 0.28);
            text-align: center;
        }

        .mark {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.25rem;
            display: grid;
            place-items: center;
            border-radius: 1rem;
            background-image: linear-gradient(140deg, #2563eb 0%, #0284c7 100%);
            color: #fff;
        }

        h1 { margin: 0 0 0.5rem; font-size: 1.125rem; letter-spacing: -0.01em; }
        p { margin: 0 0 1.5rem; font-size: 0.875rem; line-height: 1.55; color: var(--muted); }

        button {
            width: 100%;
            min-height: 2.75rem;
            border: 0;
            border-radius: 0.75rem;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }

        button:active { filter: brightness(0.95); }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3 4 5.5l1.5 4L8 8.5V21h8V8.5l2.5 1 1.5-4L16 3l-2 2h-4z"/>
            </svg>
        </div>

        <h1>Tidak ada koneksi</h1>
        <p>Data bisnis Anda perlu diambil dari server, jadi halaman ini menunggu sampai koneksi kembali.</p>

        <button type="button" onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
